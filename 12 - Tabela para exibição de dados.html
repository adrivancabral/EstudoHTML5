<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de vendas</title>
</head>
<body>
    <table>
        <caption>Relatório de vendas do primeiro trimestre</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço unitário</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Teclado mecânico</td>
                <td>15</td>
                <td>R$ 250,00</td>
            </tr>
            <tr>
                <td>Mouse gamer</td>
                <td>30</td>
                <td>R$ 120,00</td>
            </tr>
            <tr>
                <td>Monitor 24"</td>
                <td>8</td>
                <td>R$ 890,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total de itens</td>
                <td>53</td>
                <td>-</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
